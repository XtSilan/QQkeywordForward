name: qq-bot

services:
  napcat-init:
    image: python:3.12-slim
    container_name: qq-bot-napcat-init
    env_file:
      - ./.env.prod
    environment:
      NAPCAT_CONFIG_DIR: /app/napcat/config
    volumes:
      - ./data/napcat:/app/napcat/config
    # One-shot: ensure NapCat's webui.json carries the token declared in
    # NAPCAT_WEBUI_TOKEN so that webui can talk to NapCat without first
    # scraping the startup log for a random token.
    command:
      - python
      - -c
      - |
        import json, os, pathlib
        cfg_dir = pathlib.Path(os.environ["NAPCAT_CONFIG_DIR"])
        cfg_dir.mkdir(parents=True, exist_ok=True)
        p = cfg_dir / "webui.json"
        token = os.environ.get("NAPCAT_WEBUI_TOKEN", "").strip()
        if not token:
            print("napcat-init: NAPCAT_WEBUI_TOKEN empty, skip")
            raise SystemExit(0)
        cfg = json.loads(p.read_text(encoding="utf-8")) if p.exists() else {
            "host": "::", "port": 6099, "loginRate": 10
        }
        if cfg.get("token") == token:
            print(f"napcat-init: webui.json token already matches ({token})")
            raise SystemExit(0)
        cfg["token"] = token
        p.write_text(json.dumps(cfg, ensure_ascii=False, indent=2), encoding="utf-8")
        print(f"napcat-init: set webui.json token = {token}")
    restart: "no"
    networks:
      - botnet

  napcat:
    image: mlikiowa/napcat-docker:v4.18.28
    container_name: qq-bot-napcat
    restart: unless-stopped
    environment:
      NAPCAT_UID: "1000"
      NAPCAT_GID: "1000"
    volumes:
      - ./data/napcat:/app/napcat/config
    ports:
      # 宿主机端口在 .env.prod 里改（*_HOST_PORT），容器内端口固定不动，
      # 服务间互访（NAPCAT_WEBUI_URL / ONEBOT_WS_URL 等）不受影响。
      - "${NAPCAT_WEBUI_HOST_PORT:-6099}:6099"
      - "${NAPCAT_ONEBOT_HOST_PORT:-3001}:3001"
    depends_on:
      napcat-init:
        condition: service_completed_successfully
    networks:
      - botnet

  nonebot:
    build:
      context: .
      args:
        APP_VERSION: "${APP_VERSION:-dev}"
        APP_BUILD_TIME: "${APP_BUILD_TIME:-}"
        # Optional override in .env.prod (defaults to Tsinghua mirror).
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}"
    container_name: qq-bot-nonebot
    restart: unless-stopped
    command: python -m app.nonebot_bot
    env_file:
      - ./.env.prod
    environment:
      DATABASE_PATH: /app/data/nonebot/bot.sqlite3
      LOG_DIR: /app/data/logs/nonebot
      PYTHONPATH: /app
    volumes:
      - ./data/nonebot:/app/data/nonebot
      - ./data/logs/nonebot:/app/data/logs/nonebot
      - ./.env.prod:/app/.env.prod:ro
    ports:
      - "${NONEBOT_HOST_PORT:-8081}:8081"
    depends_on:
      napcat:
        condition: service_started
    networks:
      - botnet

  webui:
    build:
      context: .
      args:
        APP_VERSION: "${APP_VERSION:-dev}"
        APP_BUILD_TIME: "${APP_BUILD_TIME:-}"
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}"
    container_name: qq-bot-webui
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080
    env_file:
      - ./.env.prod
    environment:
      DATABASE_PATH: /app/data/nonebot/bot.sqlite3
      LOG_DIR: /app/data/logs/nonebot
      PYTHONPATH: /app
    volumes:
      - ./data/nonebot:/app/data/nonebot
      - ./data/logs/nonebot:/app/data/logs/nonebot
      - ./.env.prod:/app/.env.prod:ro
      # Enable only when CONTROL_ENABLED=true.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${WEBUI_HOST_PORT:-18080}:8080"
    depends_on:
      napcat:
        condition: service_started
      nonebot:
        condition: service_started
    networks:
      - botnet

  # CI/CD updater: receives the deploy webhook from GitHub Actions (and polls
  # origin as a fallback), then spawns a throwaway `qq-bot-updater-run`
  # container that does git pull + docker compose build && up -d. Mounting the
  # checkout + docker.sock here is what lets it drive the rebuild; running the
  # rebuild in a sibling container is what lets it be recreated safely.
  updater:
    build:
      context: ./deploy
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}"
    image: qq-bot-updater:local
    container_name: qq-bot-updater
    restart: unless-stopped
    env_file:
      - ./.env.prod
    environment:
      PROJECT_DIR: /project
      UPDATER_HELPER_IMAGE: qq-bot-updater:local
    volumes:
      - ./:/project
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      # Webhook target for GitHub Actions; protect with UPDATER_WEBHOOK_SECRET
      # and firewall the port if the host has a public address. Changing the
      # host port also requires updating the DEPLOY_WEBHOOK_URL repo secret.
      - "${UPDATER_HOST_PORT:-18081}:18081"
    networks:
      - botnet

networks:
  botnet:
    driver: bridge

